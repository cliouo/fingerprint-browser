name: linux-e2e
# A real Camoufox window on Ubuntu (Xvfb): an extension opens and closes
# runner tabs (as automation extensions do); `fpb open` must keep the
# window and still end when the window is closed. Runs the earlier close
# check too (--legacy), for comparison. Also passes a context to the test
# extension's options page (`fpb open --ext-context`). Downloads the browser (~700 MB).
on:
  pull_request:
    paths:
      - "src/fpb/launcher.py"
      - "src/fpb/extctx.py"
      - "scripts/e2e/**"
      - ".github/workflows/linux-e2e.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
jobs:
  window-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libxt6t64 libx11-xcb1
      - run: uv sync --locked
      - run: uv run camoufox fetch
        env:
          # camoufox looks the release up through the GitHub API; unauthenticated
          # calls from shared runners hit the rate limit (403)
          GITHUB_TOKEN: ${{ github.token }}
      - name: runner tabs under fpb open
        env:
          DISPLAY: ":99"
        run: |
          export FPB_HOME="$RUNNER_TEMP/fpb"
          Xvfb :99 -screen 0 1920x1080x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          uv run python scripts/e2e/mock_backend.py --host 0.0.0.0 > "$RUNNER_TEMP/mock.log" 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          sleep 3
          uv run fpb doctor || true
          uv run fpb new rt --extension scripts/e2e/runner_ext
          echo "::group::legacy close check (before the fix)"
          uv run python scripts/e2e/window_lifetime.py rt --legacy | tee "$RUNNER_TEMP/legacy.txt"
          echo "::endgroup::"
          echo "::group::current close check"
          uv run python scripts/e2e/window_lifetime.py rt | tee "$RUNNER_TEMP/fix.txt"
          echo "::endgroup::"
          echo "::group::proxy bypass for the extension's backend"
          bash scripts/e2e/bypass_check.sh
          echo "::endgroup::"
          echo "::group::context passed to an extension's options page"
          uv run python scripts/e2e/ext_context_check.py --port 8101 | tee "$RUNNER_TEMP/ext-context.txt"
          test "${PIPESTATUS[0]}" -eq 0
          echo "::endgroup::"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-logs
          path: |
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/fpb/profiles/*/open.log
