[project]
name = "fingerprint-browser"
version = "0.1.0"
description = "Minimal Camoufox profile launcher: fixed identity, per-profile proxy, persistent profile, extensions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "camoufox[geoip]==0.5.9",
    # macOS: whether the browser still has a window (it keeps running without one)
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.scripts]
fpb = "fpb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
